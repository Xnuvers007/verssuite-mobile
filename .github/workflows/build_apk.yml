name: Build VersSuite Mobile APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ultra-Lightweight Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split-per-ABI APKs (Ultra-Small Size ~10-15MB)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Universal Release APK (All ABIs)
        run: |
          flutter build apk --release \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: List Generated APKs & Sizes
        run: |
          echo "=== Generated APK Files & Sizes ==="
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload Optimized APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verssuite-mobile-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
